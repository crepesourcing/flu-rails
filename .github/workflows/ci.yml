name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: RSpec (Ruby ${{ matrix.ruby }}, RabbitMQ ${{ matrix.rabbitmq }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        rabbitmq: ["3.12-management-alpine", "3.13-management-alpine", "4-management-alpine"]

    services:
      rabbitmq:
        image: rabbitmq:${{ matrix.rabbitmq }}
        env:
          RABBITMQ_DEFAULT_USER: flu
          RABBITMQ_DEFAULT_PASS: flu
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics --quiet check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec
        env:
          FLU_RABBITMQ_USER: flu
          FLU_RABBITMQ_PASSWORD: flu
          FLU_REQUIRE_RABBITMQ: "true"

  build:
    name: Build gem
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - run: gem build flu-rails.gemspec
