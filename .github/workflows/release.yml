name: Release

# Publishing is triggered by pushing a version tag, e.g.:
#   git tag -a v1.3.0 -m "Version 1.3.0" && git push origin v1.3.0
#
# No RubyGems API key is stored in this repository: the gem is pushed through
# RubyGems' Trusted Publishing, which exchanges a short-lived GitHub OIDC token
# for a scoped RubyGems credential. This requires a trusted publisher declared on
# https://rubygems.org/gems/flu-rails pointing to this repository, this workflow
# file name and the 'release' environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest

    environment: release

    permissions:
      contents: write # 'rake release' pushes the version tag when it does not exist yet
      id-token: write # mandatory to request the OIDC token used by trusted publishing

    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: flu
          RABBITMQ_DEFAULT_PASS: flu
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics --quiet check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Check that the tag matches Flu::VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(ruby -Ilib -r flu-rails/version -e 'print Flu::VERSION')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match Flu::VERSION '${version}'"
            exit 1
          fi

      - name: Run tests
        run: bundle exec rspec
        env:
          FLU_RABBITMQ_USER: flu
          FLU_RABBITMQ_PASSWORD: flu
          FLU_REQUIRE_RABBITMQ: "true"

      # Builds the gem, pushes it to RubyGems.org and waits for it to be available.
      - uses: rubygems/release-gem@v1
